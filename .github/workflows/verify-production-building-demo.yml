name: Verify Production Building Demo

on:
  workflow_run:
    workflows: ["Deploy Rekixo AR3D Engine"]
    types: [completed]
  workflow_dispatch:
    inputs:
      project_slug:
        description: Optional active Building project slug to verify strictly.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rekixo-production-building-demo-qa
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact successfully deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine whether changed UI affects the Building demo
        id: scope
        if: github.event_name == 'workflow_run'
        run: node scripts/ci-change-scope.mjs push >> "$GITHUB_OUTPUT"

      - name: Verify live Building demo readiness
        env:
          REKIXO_PUBLIC_ORIGIN: https://ar3dstudio.in
          REKIXO_DEMO_PROJECT_SLUG: ${{ inputs.project_slug || vars.REKIXO_DEMO_PROJECT_SLUG }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp)"
          node scripts/verify-production-building-demo.mjs | tee "$OUT"
          {
            echo "## Production Building demo QA"
            echo '```text'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$OUT"

      - name: Install live browser-test dependencies
        if: github.event_name != 'workflow_run' || steps.scope.outputs.run_building_browser == 'true'
        run: npm ci

      - name: Restore cached Chromium
        if: github.event_name != 'workflow_run' || steps.scope.outputs.run_building_browser == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for live customer verification
        if: github.event_name != 'workflow_run' || steps.scope.outputs.run_building_browser == 'true'
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify live floor-review buttons on the actual customer site
        if: github.event_name != 'workflow_run' || steps.scope.outputs.run_building_browser == 'true'
        env:
          REKIXO_PUBLIC_ORIGIN: https://ar3dstudio.in
          REKIXO_FLOOR_UI_PROJECT_SLUG: ${{ inputs.project_slug || vars.REKIXO_DEMO_PROJECT_SLUG || 'jyoti-paradise' }}
        run: npx --no-install playwright test e2e/production-floor-controls.spec.ts --config playwright.production.config.ts
