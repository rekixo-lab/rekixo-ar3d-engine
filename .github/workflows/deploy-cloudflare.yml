name: Deploy Rekixo AR3D Engine

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_scope:
        description: Admin-only is the safe default; engine-all also changes the public viewer and Engine infrastructure.
        type: choice
        required: true
        default: admin-only
        options:
          - admin-only
          - admin-infra
          - engine-all

concurrency:
  group: rekixo-3d-production
  # Production deploys must finish verification once started; newer commits queue behind them.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  CLOUDFLARE_ACCOUNT_ID: 8f31060fbcfee2b3e9309138cad7f12f
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    # Playwright 1.55.1 cannot install Chromium dependencies on ubuntu26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require merged PR for production push
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # GitHub's commit->pulls index can lag or omit squash merge commits.
          # Verify that an actual closed PR to main carries this exact merge SHA.
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100"
          BODY="$(mktemp)"
          STATUS="$(curl --silent --show-error --output "$BODY" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$API")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Could not verify merged PR origin for production commit (HTTP $STATUS)."
            head -c 1200 "$BODY" || true
            rm -f "$BODY"
            exit 1
          fi
          node - "$BODY" "$MERGE_SHA" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const mergeSha = process.argv[3];
          const mergedToMain = Array.isArray(payload) && payload.some(
            (pr) => pr && pr.merged_at && pr.base?.ref === "main" && pr.merge_commit_sha === mergeSha
          );
          if (!mergedToMain) {
            console.error("::error::Production deploy blocked: no merged PR to main matches this exact commit SHA.");
            process.exit(1);
          }
          console.log("Production commit is associated with a merged PR to main.");
          NODE
          rm -f "$BODY"

      - name: Detect public runtime changes
        id: public_runtime
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD^)"
          fi
          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Eq '^(apps/public/|workers/(public|release-runtime|geo-release-runtime|geo-plot-public|geo-plot-geometry|masterplan-geo-public|masterplan-geo-geometry|masterplan-share-public|http-range|storage-boundary|project-branding)\.mjs$|packages/(contracts|engine-core|model-profiles)/|shared/|scripts/build-geo-model-derivative\.mjs$|project-profiles/|package(-lock)?\.json$|wrangler\.public\.jsonc$|database/migrations/0028_clean_room_project_reset_v1\.sql$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$CHANGED" | grep -Eq '^database/migrations/'; then
            echo "migrations_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "migrations_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$CHANGED" | grep -Fxq 'database/migrations/0028_clean_room_project_reset_v1.sql'; then
            echo "project_reset_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "project_reset_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify generalized Engine
        run: npm test

      - name: Install browser E2E runner
        run: npx --no-install playwright install --with-deps chromium

      - name: Run browser E2E smoke
        run: npx --no-install playwright test --config playwright.config.ts

      - name: Require Cloudflare deployment secret
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Apply isolated D1 migrations
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.deployment_scope != 'admin-only') ||
          (github.event_name == 'push' && steps.public_runtime.outputs.migrations_changed == 'true')
        run: >-
          npx --no-install wrangler
          d1 migrations apply rekixo-3d-production
          --remote
          --config wrangler.infra.jsonc

      - name: Ensure isolated R2 bucket exists
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_scope != 'admin-only'
        shell: bash
        run: |
          set -euo pipefail
          BUCKETS="$(npx --no-install wrangler r2 bucket list)"
          if printf '%s\n' "$BUCKETS" | grep -Fq "rekixo-3d-assets"; then
            echo "R2 bucket already exists: rekixo-3d-assets"
          else
            npx --no-install wrangler r2 bucket create rekixo-3d-assets
          fi

      - name: Purge project-owned R2 objects for clean-room reset
        if: github.event_name == 'push' && steps.public_runtime.outputs.project_reset_changed == 'true'
        env:
          CONFIRM_ENGINE_PROJECT_PURGE: DELETE_ENGINE_PROJECT_DATA
          R2_BUCKET: rekixo-3d-assets
          R2_PREFIX: projects/
        run: node scripts/purge-project-r2-prefix.mjs

      - name: Verify remote Engine Admin secret names
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp)"
          npx --no-install wrangler secret list --config wrangler.admin.jsonc --format json > "$OUT"
          node - "$OUT" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          const names = new Set(
            (Array.isArray(payload) ? payload : payload?.secrets || [])
              .map((item) => typeof item === "string" ? item : item?.name)
              .filter(Boolean)
          );
          const required = [
            "ENGINE_ADMIN_EMAIL",
            "ENGINE_ADMIN_PASSWORD_SALT",
            "ENGINE_ADMIN_PASSWORD_HASH",
            "ENGINE_ADMIN_SESSION_SECRET",
          ];
          const missing = required.filter((name) => !names.has(name));
          if (missing.length) {
            console.error("::error::Missing remote Engine Admin secrets: " + missing.join(", "));
            process.exit(1);
          }
          console.log("Remote Engine Admin secret names are present.");
          NODE
          rm -f "$OUT"

      - name: Check Cloudflare Containers access
        id: containers-access
        shell: bash
        run: |
          set -uo pipefail
          OUT="$(mktemp)"
          if npx --no-install wrangler containers list --config wrangler.admin.jsonc >"$OUT" 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Containers API access verified."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Containers API access is unavailable. Admin will deploy in safe Worker-only mode; DWG processing stays fail-closed until the account is on Workers Paid and CLOUDFLARE_API_TOKEN has Account > Containers > Write (or equivalent Workers Containers Write) access."
            sed -n '1,120p' "$OUT" || true
          fi
          rm -f "$OUT"

      - name: Prepare published designs and verify model checksums
        run: node scripts/prepare-published-designs.mjs

      - name: Build and upload Geo model derivatives
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.deployment_scope == 'engine-all') ||
          (github.event_name == 'push' && steps.public_runtime.outputs.changed == 'true')
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rekixo-geo-models"
          mkdir -p "$ROOT"
          mapfile -t GEO_PROJECTS < <(
            node -e '
              const fs = require("fs");
              const cfg = JSON.parse(fs.readFileSync("project-profiles/geo-model-derivatives.json", "utf8"));
              if (cfg.format !== "rekixo-geo-model-derivative-registry" || cfg.version !== 1 || !Array.isArray(cfg.projects)) {
                throw new Error("Invalid Geo derivative registry.");
              }
              for (const slug of cfg.projects) {
                if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) throw new Error("Invalid Geo derivative project slug: " + slug);
                console.log(slug);
              }
            '
          )

          for SLUG in "${GEO_PROJECTS[@]}"; do
            OUT="$ROOT/$SLUG"
            mkdir -p "$OUT"
            echo "Building Geo derivative for $SLUG"
            node scripts/build-geo-model-derivative.mjs "$SLUG" "$OUT"

            GEO_KEY="$(node -e 'const m=require(process.argv[1]); process.stdout.write(m.r2Key)' "$OUT/metadata.json")"
            META_KEY="$(node -e 'const m=require(process.argv[1]); process.stdout.write(m.metadataR2Key)' "$OUT/metadata.json")"
            GEO_SHA="$(node -e 'const m=require(process.argv[1]); process.stdout.write(m.geoSha256)' "$OUT/metadata.json")"

            npx --no-install wrangler r2 object put "rekixo-3d-assets/$GEO_KEY"               --remote               --force               --file "$OUT/model.glb"               --content-type "model/gltf-binary"               --cache-control "public,max-age=31536000,immutable"

            npx --no-install wrangler r2 object put "rekixo-3d-assets/$META_KEY"               --remote               --force               --file "$OUT/metadata.json"               --content-type "application/json"               --cache-control "public,max-age=31536000,immutable"

            npx --no-install wrangler r2 object get "rekixo-3d-assets/$GEO_KEY"               --remote               --file "$OUT/verify.glb"
            ACTUAL_SHA="$(sha256sum "$OUT/verify.glb" | awk '{print $1}')"
            if [ "$ACTUAL_SHA" != "$GEO_SHA" ]; then
              echo "::error::Uploaded Geo derivative checksum mismatch for $SLUG"
              exit 1
            fi
            test "$(head -c 4 "$OUT/verify.glb")" = "glTF"
            echo "Geo derivative uploaded and verified for $SLUG"
          done

      - name: Deploy isolated 3D Admin Worker
        # Cloudflare activates Worker code before processing Container rollout.
        # If the account/token cannot manage Containers, skip the rollout so
        # normal Admin releases remain healthy and the DWG route fails closed.
        id: admin-deploy
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.containers-access.outputs.available }}" = "true" ]; then
            npx --no-install wrangler deploy --config wrangler.admin.jsonc
          else
            npx --no-install wrangler deploy --containers-rollout=none --config wrangler.admin.jsonc
          fi

      - name: Report DWG processor deployment state
        if: steps.containers-access.outputs.available != 'true'
        shell: bash
        run: |
          echo "::warning::Rekixo Admin is deployed, but native DWG decoding is not active on Cloudflare yet. Auto Build will preserve DWG as evidence and continue safely with the remaining source pack."

      - name: Verify Engine Admin invalid-login boundary
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_URL="https://admin.rekixo.com/3Dprojects/api/cloud/login"
          BODY="$(mktemp)"
          STATUS="$(curl --silent --show-error --output "$BODY" --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://admin.rekixo.com' \
            --header 'Content-Type: application/json' \
            --data '{"email":"engine-admin@rekixo.com","password":"definitely-wrong-password"}' \
            "$LOGIN_URL" || true)"
          if [ "$STATUS" != "401" ]; then
            echo "::error::Engine Admin invalid-login boundary returned HTTP $STATUS"
            head -c 1200 "$BODY" || true
            exit 1
          fi
          grep -Fq 'Invalid email or password.' "$BODY"
          rm -f "$BODY"
          echo "Engine Admin invalid-login boundary verified."

      - name: Verify Engine Admin cloud readiness
        shell: bash
        run: |
          set -euo pipefail
          SESSION_URL="https://admin.rekixo.com/3Dprojects/api/cloud/session"
          BODY="$(mktemp)"
          STATUS="$(curl --location --silent --show-error --output "$BODY" --write-out '%{http_code}' "$SESSION_URL" || true)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Engine Admin session endpoint returned HTTP $STATUS"
            head -c 1000 "$BODY" || true
            exit 1
          fi
          node - "$BODY" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          if (payload.configured !== true) {
            console.error("::error::Engine Admin secrets are not active on rekixo-3d-admin.");
            process.exit(1);
          }
          if (payload.databaseReady !== true) {
            console.error("::error::Engine Admin cloud schema is not ready on rekixo-3d-admin.");
            process.exit(1);
          }
          console.log("Engine Admin secrets and cloud schema are active.");
          NODE
          rm -f "$BODY"

      - name: Deploy isolated 3D Public Worker
        # Manual engine-all always deploys Public. Normal main pushes deploy
        # Public only when public runtime code/dependencies changed.
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.deployment_scope == 'engine-all') ||
          (github.event_name == 'push' && steps.public_runtime.outputs.changed == 'true')
        run: >-
          npx --no-install wrangler
          deploy
          --config wrangler.public.jsonc

      - name: Verify deployed Design Admin entry and editor bundle
        run: node scripts/verify-design-admin.mjs

      - name: Verify report-only browser security policy
        shell: bash
        run: |
          set -euo pipefail
          for PAGE_URL in             "https://admin.rekixo.com/3Dprojects"             "https://ar3dstudio.in/3Dprojects"; do
            HEADERS="$(mktemp)"
            curl --location --silent --show-error --dump-header "$HEADERS" --output /dev/null "$PAGE_URL"
            if ! grep -Eiq '^content-security-policy-report-only:' "$HEADERS"; then
              echo "::error::Missing Content-Security-Policy-Report-Only on $PAGE_URL"
              cat "$HEADERS"
              rm -f "$HEADERS"
              exit 1
            fi
            if grep -Eiq '^content-security-policy:' "$HEADERS"; then
              echo "::error::Enforcing CSP appeared before report-only validation was completed: $PAGE_URL"
              cat "$HEADERS"
              rm -f "$HEADERS"
              exit 1
            fi
            rm -f "$HEADERS"
          done
          echo "Report-only browser security policy verified on Admin and Public."

      - name: Verify active immutable release integrity
        env:
          REKIXO_PUBLIC_ORIGIN: https://ar3dstudio.in
        run: node scripts/verify-production-release-integrity.mjs

      - name: Verify sensitive Admin reads are protected
        shell: bash
        run: |
          set -euo pipefail
          for API_URL in             "https://admin.rekixo.com/3Dprojects/api/projects"             "https://admin.rekixo.com/3Dprojects/api/status?slug=no-project-selected"; do
            BODY="$(mktemp)"
            STATUS="$(curl --location --silent --show-error --output "$BODY" --write-out '%{http_code}' "$API_URL" || true)"
            if [ "$STATUS" != "401" ] && [ "$STATUS" != "503" ]; then
              echo "::error::Sensitive Admin read unexpectedly returned HTTP $STATUS: $API_URL"
              head -c 1000 "$BODY" || true
              exit 1
            fi
            grep -Eq 'Engine Admin (sign-in required|authentication is not configured)|cloud schema is not installed' "$BODY"
            rm -f "$BODY"
          done
          echo "Sensitive Engine Admin read surfaces are fail-closed."

      - name: Verify empty-safe Engine production shell
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_ORIGIN="https://admin.rekixo.com"
          PUBLIC_ORIGIN="https://ar3dstudio.in"
          PAGE="$(mktemp)"
          STATUS_BODY="$(mktemp)"
          PUBLIC_BODY="$(mktemp)"

          retry_http() {
            local label="$1"
            local url="$2"
            local output="$3"
            shift 3
            local attempt expected
            HTTP_CODE="000"
            for attempt in 1 2 3 4 5 6; do
              HTTP_CODE="$(curl --location --silent --show-error --output "$output" --write-out '%{http_code}' "$url" || true)"
              echo "$label attempt $attempt/6 -> HTTP $HTTP_CODE" >&2
              for expected in "$@"; do
                if [ "$HTTP_CODE" = "$expected" ]; then
                  return 0
                fi
              done
              if [ "$attempt" != "6" ]; then sleep 2; fi
            done
            echo "::error::$label never reached an expected HTTP status. Last status: $HTTP_CODE"
            head -c 1000 "$output" || true
            return 1
          }

          retry_http "Admin project shell" "$ADMIN_ORIGIN/3Dprojects" "$PAGE" 200
          PAGE_CODE="$HTTP_CODE"
          retry_http "Admin empty status" "$ADMIN_ORIGIN/3Dprojects/api/status?slug=no-project-selected" "$STATUS_BODY" 401 503
          STATUS_CODE="$HTTP_CODE"
          retry_http "Public missing project" "$PUBLIC_ORIGIN/3Dprojects/api/projects/no-project-selected" "$PUBLIC_BODY" 404
          PUBLIC_CODE="$HTTP_CODE"

          echo "Production shell status summary: admin=$PAGE_CODE status=$STATUS_CODE public=$PUBLIC_CODE"
          if ! grep -Fq '<title>Rekixo 3D Projects</title>' "$PAGE"; then
            echo "::error::Admin shell returned HTTP 200 without the expected Rekixo 3D Projects title."
            head -c 1000 "$PAGE" || true
            exit 1
          fi

          ASSET_PATH="$(grep -oE 'src="/3Dprojects/assets/[^"]+\.js"' "$PAGE" | head -n1 | cut -d'"' -f2 || true)"
          if [ -z "$ASSET_PATH" ]; then
            echo "::error::Admin shell did not expose a 3Dprojects JavaScript asset path."
            head -c 1000 "$PAGE" || true
            exit 1
          fi

          ASSET_META=""
          for attempt in 1 2 3 4 5 6; do
            ASSET_META="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}|%{content_type}' "$ADMIN_ORIGIN$ASSET_PATH" || true)"
            ASSET_CODE="${ASSET_META%%|*}"
            ASSET_TYPE="${ASSET_META#*|}"
            echo "Admin asset attempt $attempt/6 -> $ASSET_CODE | $ASSET_TYPE"
            if [ "$ASSET_CODE" = "200" ] && [[ "$ASSET_TYPE" == *javascript* ]]; then
              break
            fi
            if [ "$attempt" != "6" ]; then sleep 2; fi
          done
          if [ "$ASSET_CODE" != "200" ] || [[ "$ASSET_TYPE" != *javascript* ]]; then
            echo "::error::Admin JavaScript asset did not become ready: $ASSET_META"
            exit 1
          fi

          rm -f "$PAGE" "$STATUS_BODY" "$PUBLIC_BODY"
          echo "Engine production shell verified without requiring any project fixture."
